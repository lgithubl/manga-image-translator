name: Build Linux Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: linux-cpu
      variant:
        description: Image variant to build
        required: true
        type: choice
        options:
          - cpu
          - cuda
        default: cpu
      preload_models:
        description: Download bundled models while building the image, CUDA variant only
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=manga-image-translator-${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Select Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [ "${{ inputs.variant }}" = "cuda" ]; then
            echo "file=Dockerfile.linux" >> "$GITHUB_OUTPUT"
          else
            echo "file=Dockerfile.cpu" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          tags: ${{ steps.tags.outputs.image }}
          build-args: |
            PRELOAD_MODELS=${{ inputs.preload_models }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball
        run: |
          docker pull "${{ steps.tags.outputs.image }}"
          docker save "${{ steps.tags.outputs.image }}" | gzip -1 > "${{ steps.tags.outputs.artifact_name }}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.tags.outputs.artifact_name }}
          path: ${{ steps.tags.outputs.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 7
