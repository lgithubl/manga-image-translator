name: Build Linux Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: linux-cuda
      preload_models:
        description: Download bundled models while building the image
        required: true
        type: boolean
        default: false
      dockerhub_image:
        description: Optional Docker Hub image, for example username/manga-image-translator
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-22.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.dockerhub_image != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
            if [ -n "${{ inputs.dockerhub_image }}" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "${{ inputs.dockerhub_image }}:${{ inputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PRELOAD_MODELS=${{ inputs.preload_models }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
